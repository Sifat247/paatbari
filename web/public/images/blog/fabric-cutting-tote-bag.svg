<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="100%" height="100%" style="background:#FAF8F5; font-family: 'Hind Siliguri', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGradTote" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <linearGradient id="rollGradTote" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFE5D8"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </linearGradient>
    <linearGradient id="bagCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9F6F1"/>
    </linearGradient>
    <filter id="shadowTote" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#203E2B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="580" fill="url(#bgGradTote)" rx="20"/>

  <!-- Top Title -->
  <rect x="40" y="25" width="840" height="60" rx="12" fill="#203E2B" filter="url(#shadowTote)"/>
  <text x="65" y="62" font-size="20" font-weight="700" fill="#FFFFFF">✂️ জুট টোট ব্যাগের কাটিং লেআউট: ১ থান কাপড় থেকে ৩টি বড় ব্যাগ</text>
  <text x="690" y="61" font-size="14" font-weight="600" fill="#D3A971">ফলন: পুরো ৩টি প্রিমিয়াম ব্যাগ</text>

  <!-- Dimensions Indicator (Top 60 Inches) -->
  <line x1="120" y1="105" x2="840" y2="105" stroke="#879B86" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="120,105 128,101 128,109" fill="#879B86"/>
  <polygon points="840,105 832,101 832,109" fill="#879B86"/>
  <rect x="420" y="93" width="130" height="24" rx="6" fill="#203E2B"/>
  <text x="485" y="110" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">দৈর্ঘ্য: ৬০ ইঞ্চি (60")</text>

  <!-- Dimensions Indicator (Left 36 Inches) -->
  <line x1="85" y1="125" x2="85" y2="485" stroke="#879B86" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="85,125 81,133 89,133" fill="#879B86"/>
  <polygon points="85,485 81,477 89,477" fill="#879B86"/>
  <rect x="25" y="295" width="115" height="24" rx="6" fill="#203E2B"/>
  <text x="82" y="312" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">প্রস্থ: ৩৬ ইঞ্চি (36")</text>

  <!-- Main Fabric Roll Container: 36" x 60" = 2,160 sq.in -->
  <rect x="120" y="125" width="720" height="360" rx="14" fill="url(#rollGradTote)" stroke="#CBB49D" stroke-width="2.5" filter="url(#shadowTote)"/>

  <!-- 3 Big Bags Layout Columns -->
  <!-- Each bag takes 644 sq.in (420 body + 182 handles + 42 chain strips) -->

  <!-- Bag 1 Section -->
  <g transform="translate(135, 138)">
    <rect width="215" height="334" rx="12" fill="url(#bagCardGrad)" stroke="#203E2B" stroke-width="1.8" filter="url(#shadowTote)"/>
    <rect x="0" y="0" width="215" height="38" rx="12" fill="#203E2B"/>
    <text x="107" y="25" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">🛍️ টোট ব্যাগ #১ (৬৪৪ sq.in)</text>

    <!-- Body Panels (420 sq.in) -->
    <rect x="12" y="48" width="191" height="135" rx="8" fill="#F4EFE6" stroke="#CBB49D" stroke-width="1.2"/>
    <text x="107" y="78" font-size="13" font-weight="700" fill="#203E2B" text-anchor="middle">মেইন বডি প্যানেল (২ পাশ)</text>
    <text x="107" y="98" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">১৫" × ১৪" = ২১০ sq.in × ২</text>
    <rect x="35" y="112" width="145" height="22" rx="5" fill="#203E2B"/>
    <text x="107" y="127" font-size="11" font-weight="700" fill="#D3A971" text-anchor="middle">মোট বডি: ৪২০ বর্গইঞ্চি</text>

    <!-- Handle Belts (182 sq.in) -->
    <rect x="12" y="192" width="191" height="70" rx="8" fill="#F4EFE6" stroke="#CBB49D" stroke-width="1.2"/>
    <text x="107" y="215" font-size="13" font-weight="700" fill="#203E2B" text-anchor="middle">হ্যান্ডেল বেল্ট (২টি ফিতা)</text>
    <text x="107" y="233" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">২৬" × ৩.৫" = ৯১ sq.in × ২</text>
    <text x="107" y="251" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">মোট বেল্ট: ১৮২ বর্গইঞ্চি</text>

    <!-- Chain Strips (42 sq.in) -->
    <rect x="12" y="270" width="191" height="52" rx="8" fill="#F4EFE6" stroke="#CBB49D" stroke-width="1.2"/>
    <text x="107" y="291" font-size="12" font-weight="700" fill="#203E2B" text-anchor="middle">চেইন প্যানেল ফিতা (২টি)</text>
    <text x="107" y="309" font-size="11" font-weight="600" fill="#6B7280" text-anchor="middle">১.৫" × ১৪" = ২১ sq.in × ২ = ৪২ sq.in</text>
  </g>

  <!-- Bag 2 Section -->
  <g transform="translate(365, 138)">
    <rect width="215" height="334" rx="12" fill="url(#bagCardGrad)" stroke="#203E2B" stroke-width="1.8" filter="url(#shadowTote)"/>
    <rect x="0" y="0" width="215" height="38" rx="12" fill="#203E2B"/>
    <text x="107" y="25" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">🛍️ টোট ব্যাগ #২ (৬৪৪ sq.in)</text>

    <!-- Body Panels (420 sq.in) -->
    <rect x="12" y="48" width="191" height="135" rx="8" fill="#F4EFE6" stroke="#CBB49D" stroke-width="1.2"/>
    <text x="107" y="78" font-size="13" font-weight="700" fill="#203E2B" text-anchor="middle">মেইন বডি প্যানেল (২ পাশ)</text>
    <text x="107" y="98" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">১৫" × ১৪" = ২১০ sq.in × ২</text>
    <rect x="35" y="112" width="145" height="22" rx="5" fill="#203E2B"/>
    <text x="107" y="127" font-size="11" font-weight="700" fill="#D3A971" text-anchor="middle">মোট বডি: ৪২০ বর্গইঞ্চি</text>

    <!-- Handle Belts (182 sq.in) -->
    <rect x="12" y="192" width="191" height="70" rx="8" fill="#F4EFE6" stroke="#CBB49D" stroke-width="1.2"/>
    <text x="107" y="215" font-size="13" font-weight="700" fill="#203E2B" text-anchor="middle">হ্যান্ডেল বেল্ট (২টি ফিতা)</text>
    <text x="107" y="233" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">২৬" × ৩.৫" = ৯১ sq.in × ২</text>
    <text x="107" y="251" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">মোট বেল্ট: ১৮২ বর্গইঞ্চি</text>

    <!-- Chain Strips (42 sq.in) -->
    <rect x="12" y="270" width="191" height="52" rx="8" fill="#F4EFE6" stroke="#CBB49D" stroke-width="1.2"/>
    <text x="107" y="291" font-size="12" font-weight="700" fill="#203E2B" text-anchor="middle">চেইন প্যানেল ফিতা (২টি)</text>
    <text x="107" y="309" font-size="11" font-weight="600" fill="#6B7280" text-anchor="middle">১.৫" × ১৪" = ২১ sq.in × ২ = ৪২ sq.in</text>
  </g>

  <!-- Bag 3 Section -->
  <g transform="translate(595, 138)">
    <rect width="215" height="334" rx="12" fill="url(#bagCardGrad)" stroke="#203E2B" stroke-width="1.8" filter="url(#shadowTote)"/>
    <rect x="0" y="0" width="215" height="38" rx="12" fill="#203E2B"/>
    <text x="107" y="25" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">🛍️ টোট ব্যাগ #৩ (৬৪৪ sq.in)</text>

    <!-- Body Panels (420 sq.in) -->
    <rect x="12" y="48" width="191" height="135" rx="8" fill="#F4EFE6" stroke="#CBB49D" stroke-width="1.2"/>
    <text x="107" y="78" font-size="13" font-weight="700" fill="#203E2B" text-anchor="middle">মেইন বডি প্যানেল (২ পাশ)</text>
    <text x="107" y="98" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">১৫" × ১৪" = ২১০ sq.in × ২</text>
    <rect x="35" y="112" width="145" height="22" rx="5" fill="#203E2B"/>
    <text x="107" y="127" font-size="11" font-weight="700" fill="#D3A971" text-anchor="middle">মোট বডি: ৪২০ বর্গইঞ্চি</text>

    <!-- Handle Belts (182 sq.in) -->
    <rect x="12" y="192" width="191" height="70" rx="8" fill="#F4EFE6" stroke="#CBB49D" stroke-width="1.2"/>
    <text x="107" y="215" font-size="13" font-weight="700" fill="#203E2B" text-anchor="middle">হ্যান্ডেল বেল্ট (২টি ফিতা)</text>
    <text x="107" y="233" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">২৬" × ৩.৫" = ৯১ sq.in × ২</text>
    <text x="107" y="251" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">মোট বেল্ট: ১৮২ বর্গইঞ্চি</text>

    <!-- Chain Strips (42 sq.in) -->
    <rect x="12" y="270" width="191" height="52" rx="8" fill="#F4EFE6" stroke="#CBB49D" stroke-width="1.2"/>
    <text x="107" y="291" font-size="12" font-weight="700" fill="#203E2B" text-anchor="middle">চেইন প্যানেল ফিতা (২টি)</text>
    <text x="107" y="309" font-size="11" font-weight="600" fill="#6B7280" text-anchor="middle">১.৫" × ১৪" = ২১ sq.in × ২ = ৪২ sq.in</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="120" y="500" width="720" height="55" rx="10" fill="#FFFFFF" stroke="#EADBCE" stroke-width="1.5" filter="url(#shadowTote)"/>
  <text x="145" y="525" font-size="13" font-weight="700" fill="#203E2B">💡 গণিতের হিসাব:</text>
  <text x="245" y="525" font-size="13" font-weight="600" fill="#4B5563">প্রতি ব্যাগে মোট কাপড়: ৪২০ + ১৮২ + ৪২ = ৬৪৪ বর্গইঞ্চি।</text>
  <text x="145" y="543" font-size="12" font-weight="700" fill="#B45309">১ থান (২,১৬০ বর্গইঞ্চি) ÷ ৬৪৪ = ৩.৩৫ ➔ নিখুঁত ৩টি ব্যাগ + ২২৮ বর্গইঞ্চি সেফটি বাফার ও বর্ডার মার্জিন!</text>
</svg>
